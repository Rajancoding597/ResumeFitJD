spring.application.name=resume-tailor
server.port=${PORT:8080}
feature.coach.enabled=false
feature.user-gemini-key.required=true

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
gemini.api-base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
gemini.timeout=${GEMINI_TIMEOUT_SECONDS:60}s

# AI execution guardrails (retry + concurrency)
ai.exec.max-concurrent=${AI_MAX_CONCURRENT:3}
ai.exec.max-attempts=${AI_MAX_ATTEMPTS:2}
ai.exec.base-backoff=${AI_BASE_BACKOFF_MS:250}ms
ai.exec.max-backoff=${AI_MAX_BACKOFF_MS:2000}ms
ai.exec.acquire-timeout=${AI_ACQUIRE_TIMEOUT_MS:2000}ms

# Prompt/token control (simple character limits)
ai.limits.max-job-description-chars=${AI_MAX_JD_CHARS:12000}
ai.limits.max-bullet-chars=${AI_MAX_BULLET_CHARS:1200}
ai.limits.max-chat-message-chars=${AI_MAX_CHAT_MSG_CHARS:1200}
ai.limits.max-chat-history-messages=${AI_MAX_CHAT_HISTORY:12}
